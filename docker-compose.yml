services:
  app:
    build: .
    image: allergen-trace:latest
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # 宿主机端口映射用 APP_PORT；容器内服务固定监听 8000
      DB_PATH: /data/allergen.db
      APP_PORT: 8000
    volumes:
      - allergen-data:/data
    restart: unless-stopped

volumes:
  allergen-data:
